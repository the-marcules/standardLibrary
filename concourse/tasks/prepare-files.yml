platform: linux
image_resource:
  type: docker-image
  source:
    repository: alpine
    tag: latest
inputs:
  - name: source-code
outputs:
  - name: artifacts
  - name: build
run:
  path: sh
  args:
    - -c
    - |
      # Kopiere Dateien aus dem Repo
      echo "Copying files..."
      cp source-code/concourse/src/* build/
      echo "Files copied."
