resources:
  - name: source-code
    type: git
    source:
      uri: git@github.com:the-marcules/standardLibrary.git
      branch: master
      private_key: ((git-private-key))

jobs:
  - name: my-pipe
    plan:
      - get: source-code
        trigger: true
      - task: prepare-files
        file: tasks/prepare-files.yml
      - task: run-tests
        file: tasks/run-tests.yml
      - task: build-go-app
        file: tasks/build-go-app.yml
      - task: run
        file: tasks/run.yml
