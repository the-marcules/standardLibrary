resources:
  - name: source-code
    type: git
    source:
      uri: git@github.com:the-marcules/standardLibrary.git
      branch: master
      private_key: ((git-private-key))

jobs:
  - name: my-pipe
    plan:
      - get: source-code
      - task: prepare-files
        config:
          platform: linux
          image_resource:
            type: docker-image
            source:
              repository: alpine
              tag: latest
          inputs:
            - name: source-code
          outputs:
            - name: artifacts
            - name: build
          run:
            path: sh
            args:
              - -c
              - |
                # Kopiere Dateien aus dem Repo
                echo "Copying files..."
                cp source-code/concourse/src/* build/
                echo "Files copied."
      - task: run-tests
        config:
          platform: linux
          image_resource:
            type: docker-image
            source:
              repository: golang
              tag: latest
          inputs:
            - name: build
          run:
            path: sh
            args:
              - -c
              - |
                echo "Running tests..."
                cd build
                pwd
                ls -lah
                go test ./...

      - task: build-go-app
        config:
          platform: linux
          image_resource:
            type: docker-image
            source:
              repository: golang
              tag: latest
          inputs:
            - name: artifacts
            - name: build
          run:
            path: sh
            args:
              - -c
              - |
                echo "Building Go app..."
                cd build
                go build -o ../artifacts/myapp main.go
